name: sheba_ai
description: "Sheba AI - Your Personal Assistant for Medical Services"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  rounded_loading_button_plus: ^3.0.1
  toastification: ^3.0.3
  flutter_screenutil: ^5.9.3
  animate_do: ^4.2.0
  timeago: ^3.7.1
  awesome_snackbar_content: ^0.1.7
  cached_network_image: ^3.4.1
  device_preview: ^1.3.1
  dio: ^5.8.0+1
  dotted_border: ^3.1.0
  dropdown_button2: ^2.3.9
  file_picker: ^10.2.0
  image_picker: ^1.1.2
  flutter_form_builder: ^10.1.0
  form_builder_validators: ^11.2.0
  flutter_launcher_icons: ^0.14.4
  #  flutter_local_notifications: ^19.3.0
  flutter_riverpod: ^2.6.1
  flutter_spinkit: ^5.2.1
  flutter_svg: ^2.2.0
  freezed_annotation: ^3.1.0
  get_it: ^8.0.3
  infinite_scroll_pagination: ^5.1.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  jwt_decoder: ^2.0.1
  logger: ^2.6.1
  logging: ^1.3.0
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
  percent_indicator: ^4.2.5
  permission_handler: ^12.0.1
  platform_info: ^5.0.0
  share_plus: ^11.0.0
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  skeletonizer: ^2.1.0+1
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0
  simple_ripple_animation: ^0.1.0
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  flutter_onboarding_slider: ^1.0.11
  pinput: ^5.0.1
  carousel_slider: ^5.1.1
  tab_container: ^3.5.3
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  freezed: ^3.2.0
  flutter_lints: ^6.0.0
  build_runner: ^2.6.0
  json_serializable: ^6.10.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/anims/

  fonts:
    - family: SF Pro
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
